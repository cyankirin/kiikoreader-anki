name: Publish web flasher

on:
  push:
    branches: [main]
    paths:
      - flash/index.html
      - flash/notices.html
      - flash/manual.html
      - flash/manual/**
      - flash/new-features/**
      - flash/simulator/**
      - flash/assets/**
      - flash/site.css
      - flash/site.js
      - flash/installer-bridge.js
      - flash/flasher-integrity.js
      - flash/_headers
      - flash/manifest.json
      - flash/releases.json
      - flash/releases/**
      - flash/versions.js
      - flash/metalio/**
      - flash/metalio-s31-update.json
      - flash/metalio-installer.js
      - flash/metalio-flash-core.js
      - flash/metalio-connection.js
      - flash/metalio-flash-reader.js
      - flash/metalio-transport.js
      - flash/metalio-native-stub.js
      - tools/metalio_release_assets.py
      - flash/update.json
      - flash/Pico-update*.bin
      - flash/firmware.bin
      - flash/ota_data_initial.bin
      - flash/bootloader.bin
      - flash/partitions.bin
      - flash/vendor/**
      - flash/licenses/**
      - THIRD_PARTY_NOTICES.md
      - LICENSE
      - licenses/**
      - tools/release_assets.py
      - flash/release-assets.json
      - tools/stage_public_flash.py
      - tools/verify_flash_bundle.py
      - tools/package_flash.py
      - .github/workflows/pages.yml
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Metalio 使用受保护的 main 发布站点；其独立标签只归档固件。 / Deploy Metalio metadata from protected main; its tag archives binaries only.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'metalio-s31-')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate and stage public flashing files
        run: python3 tools/stage_public_flash.py _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
